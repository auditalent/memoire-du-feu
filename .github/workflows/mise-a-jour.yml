name: Mise à jour des données

# Recopie chaque nuit la version publiée sur continuumsolutions.fr, qui fait foi,
# et ne crée un commit que si les données ont changé.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mise-a-jour:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Récupérer la version publiée
        run: |
          curl -fsSL https://continuumsolutions.fr/donnees/memoire-du-feu.json -o donnees/memoire-du-feu.json
          python3 -c "import json; json.load(open('donnees/memoire-du-feu.json', encoding='utf-8'))"

      - name: Enregistrer si les données ont changé
        run: |
          if git diff --quiet -- donnees/memoire-du-feu.json; then
            echo "Aucune modification."
            exit 0
          fi
          version=$(python3 -c "import json; print(json.load(open('donnees/memoire-du-feu.json', encoding='utf-8'))['dateModification'])")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add donnees/memoire-du-feu.json
          git commit -m "Données : version du ${version}"
          git push
